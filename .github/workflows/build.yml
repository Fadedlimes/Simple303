name: Multi-Platform Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact_name: Simple303-Linux
          - name: macOS
            os: macos-latest
            artifact_name: Simple303-macOS
          - name: Windows
            os: windows-latest
            artifact_name: Simple303-Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Linux Dependencies ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libasound2-dev \
            libjack-jackd2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfreetype6-dev \
            libxcomposite-dev

      # --- Configure CMake ---
      - name: Configure CMake (Linux & Windows)
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS Universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      # --- Build ---
      - name: Build Simple303
        run: cmake --build build --config Release --parallel

      # --- Package Artifacts ---
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          find build -name "Simple303.vst3" -exec cp -r {} package/ \;
          find build -name "Simple303" -type f -executable -exec cp {} package/ \;
          cd package && zip -r ../${{ matrix.artifact_name }}.zip ./*

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          find build -name "Simple303.vst3" -exec cp -R {} package/ \;
          find build -name "Simple303.component" -exec cp -R {} package/ \; || true
          find build -name "Simple303.app" -exec cp -R {} package/ \;
          cd package && zip -r -y ../${{ matrix.artifact_name }}.zip ./*

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Get-ChildItem -Path build -Filter "Simple303.vst3" -Recurse | Copy-Item -Destination package/ -Recurse
          Get-ChildItem -Path build -Filter "Simple303.exe" -Recurse | Copy-Item -Destination package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact_name }}.zip"

      # --- Upload Artifacts ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  # --- Automatic GitHub Release on Git Tag (v*) ---
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Simple303-Linux/Simple303-Linux.zip
            artifacts/Simple303-macOS/Simple303-macOS.zip
            artifacts/Simple303-Windows/Simple303-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
